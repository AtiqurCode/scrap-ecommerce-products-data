[project]
name = "scrap-ecommerce"
version = "0.1.0"
description = "Scrape Cartup category/shop/product pages into a dated CSV"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "playwright>=1.62.0",
    "pymysql>=1.2.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
scrape = "scrap_ecommerce:main"
scrape-ui = "scrap_ecommerce.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
